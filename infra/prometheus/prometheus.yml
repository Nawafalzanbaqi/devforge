global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'devforge-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['control-plane-api:8080', 'host.docker.internal:5164']

  - job_name: 'devforge-monitoring-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['monitoring-worker:8085', 'host.docker.internal:8085']

  - job_name: 'devforge-buildworker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8091']

  - job_name: 'devforge-qaworker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8092']

  - job_name: 'devforge-deploymentworker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8093']

  - job_name: 'devforge-repairworker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8094']
